{% extends "base.html" %}
{% block title %}Register · Time tracker{% endblock %}
{% block content %}
<section class="card login">
  <h1>Create an account</h1>
  <form id="register-form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" maxlength="50" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-help" required>
    <p id="password-help">Use at least 8 characters.</p>
    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Create account</button>
    <p id="error" role="alert"></p>
  </form>
  <p>Already have an account? <a href="{{ url_for('auth.login_page') }}">Log in</a></p>
</section>
<script>
document.getElementById('register-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = event.target.querySelector('button');
  const error = document.getElementById('error');
  const password = document.getElementById('password').value;
  error.textContent = '';
  if (password !== document.getElementById('confirm-password').value) {
    error.textContent = 'Passwords do not match.';
    return;
  }
  button.disabled = true;
  try {
    const response = await fetch('/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: document.getElementById('username').value, password}),
    });
    const data = await response.json();
    if (!response.ok) {
      error.textContent = data.error || 'Registration failed.';
      return;
    }
    window.location.assign('/login?registered=1');
  } catch {
    error.textContent = 'Could not connect. Please try again.';
  } finally {
    button.disabled = false;
  }
});
</script>
{% endblock %}
