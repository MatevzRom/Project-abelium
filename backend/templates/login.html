{% extends "base.html" %}
{% block title %}Log in · Time tracker{% endblock %}
{% block content %}
<section class="card login">
  <h1>Time tracker</h1>
  <p>Log in to explore your pages.</p>
  {% if request.args.get('registered') == '1' %}
  <p role="status">Account created. You can now log in.</p>
  {% endif %}
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <p id="error" role="alert"></p>
  </form>
  <p>Need an account? <a href="{{ url_for('register_page') }}">Register</a></p>
</section>
<script>
document.getElementById('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = event.target.querySelector('button');
  const error = document.getElementById('error');
  button.disabled = true;
  error.textContent = '';
  try {
    const response = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await response.json();
    if (!response.ok) {
      error.textContent = data.error || 'Login failed.';
      return;
    }
    window.location.assign('/pages/home');
  } catch {
    error.textContent = 'Could not connect. Please try again.';
  } finally {
    button.disabled = false;
  }
});
</script>
{% endblock %}
